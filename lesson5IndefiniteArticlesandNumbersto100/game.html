<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matching Game</title>
    <style>
        /* Guía de Estilo Visual */
        :root {
            --primary-pink: #FF79AC;
            --secondary-pink: #FFEBF2;
            --text-main: #121118;
            --bg-page: #FFFFFF;
            --success-bg: #D4EDDA;
            --error-bg: #F8D7DA;
            --btn-bg: #FFB3D1;
            --box-bg: #F9F9F9;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 850px;
            text-align: center;
        }

        h1 {
            color: var(--primary-pink);
            font-size: 3.8rem;
            font-weight: 900;
            margin-top: 0;
            margin-bottom: 5px;
            letter-spacing: -1px;
            line-height: 1.1;
        }

        h2 {
            color: var(--primary-pink);
            font-size: 1.6rem;
            font-weight: 600;
            border-bottom: 2px solid var(--primary-pink);
            display: inline-block;
            margin-top: 0;
            margin-bottom: 30px;
            padding-bottom: 5px;
            text-transform: lowercase;
        }

        /* Navegación de niveles */
        .level-selector {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .level-btn {
            background-color: var(--btn-bg);
            border: none;
            border-bottom: 3px solid var(--primary-pink);
            border-radius: 5px;
            padding: 8px 15px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            color: black;
            transition: opacity 0.2s;
        }

        .level-btn.active {
            background-color: var(--primary-pink);
            color: white;
        }

        .game-area {
            background-color: var(--box-bg);
            border-radius: 8px;
            padding: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            min-height: 250px;
        }

        .column {
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
        }

        .word-btn {
            width: 100%;
            max-width: 240px;
            background-color: var(--btn-bg);
            border: none;
            border-bottom: 2px solid #808080; /* Gris según guía */
            border-radius: 5px;
            padding: 12px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            color: black;
            text-align: center;
            transition: all 0.2s ease;
            position: relative;
        }

        /* Estados de los botones */
        .word-btn.selected {
            background-color: var(--secondary-pink);
            border-bottom-color: var(--primary-pink);
            font-weight: 700;
        }

        .word-btn.match-success {
            background-color: var(--success-bg) !important;
            border-bottom-color: #28a745;
            pointer-events: none;
            color: #155724;
        }

        .word-btn.match-error {
            background-color: var(--error-bg) !important;
            border-bottom-color: #dc3545;
            color: #721c24;
        }

        /* Responsividad */
        @media (max-width: 600px) {
            h1 { font-size: 2.6rem; }
            h2 { font-size: 1.3rem; }
            .game-area { grid-template-columns: 1fr; }
            .word-btn { max-width: 100%; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Matching game</h1>
    <h2>test your memory</h2>

    <div class="level-selector" id="levelSelector">
        <button class="level-btn active" onclick="changeLevel(0)">Nivel 1</button>
        <button class="level-btn" onclick="changeLevel(1)">Nivel 2</button>
        <button class="level-btn" onclick="changeLevel(2)">Nivel 3</button>
    </div>

    <div class="game-area">
        <div class="column" id="colSpanish"></div>
        <div class="column" id="colEnglish"></div>
    </div>
</div>

<script>
    const levelsData = [
        // Nivel 1 (6 pares): Sustantivos y deportes
        [
            { id: 1, es: 'el béisbol', en: 'baseball' },
            { id: 2, es: 'el águila', en: 'eagle' },
            { id: 3, es: 'el kilómetro', en: 'kilometer' },
            { id: 4, es: 'el zapato', en: 'shoe' },
            { id: 5, es: 'el deporte', en: 'sport' },
            { id: 6, es: 'la cerveza', en: 'beer' }
        ],
        // Nivel 2 (6 pares): Verbos y adjetivos
        [
            { id: 7, es: 'católico', en: 'Catholic' },
            { id: 8, es: 'enseñar', en: 'to teach' },
            { id: 9, es: 'mirar', en: 'to look at' },
            { id: 10, es: 'caminar', en: 'to walk' },
            { id: 11, es: 'llevar', en: 'to wear, to carry' },
            { id: 12, es: 'buscar', en: 'to look for' }
        ],
        // Nivel 3 (6 pares): Preguntas, números y expresiones
        [
            { id: 13, es: 'necesitar', en: 'to need' },
            { id: 14, es: '¿cuánto?, ¿cuánta?', en: 'how much?' },
            { id: 15, es: 'para', en: 'for' },
            { id: 16, es: '¿cuántos?, ¿cuántas?', en: 'how many?' },
            { id: 17, es: 'cero', en: 'zero' },
            { id: 18, es: 'dos', en: 'two' }
        ]
    ];

    let currentLevel = 0;
    let selectedSpanish = null;
    let selectedEnglish = null;
    let isChecking = false;

    function shuffle(array) {
        return [...array].sort(() => Math.random() - 0.5);
    }

    function changeLevel(levelIdx) {
        if (isChecking) return;
        currentLevel = levelIdx;
        
        // UI de niveles
        const buttons = document.querySelectorAll('.level-btn');
        buttons.forEach((btn, idx) => {
            btn.classList.toggle('active', idx === levelIdx);
        });

        resetGame();
        renderLevel();
    }

    function resetGame() {
        selectedSpanish = null;
        selectedEnglish = null;
        isChecking = false;
        document.getElementById('colSpanish').innerHTML = '';
        document.getElementById('colEnglish').innerHTML = '';
    }

    function renderLevel() {
        const data = levelsData[currentLevel];
        
        const spanishWords = shuffle(data.map(item => item.es));
        const englishWords = shuffle(data.map(item => item.en));

        const colEs = document.getElementById('colSpanish');
        const colEn = document.getElementById('colEnglish');

        spanishWords.forEach(word => {
            const btn = document.createElement('button');
            btn.className = 'word-btn';
            btn.textContent = word;
            btn.onclick = () => selectWord(btn, 'es');
            colEs.appendChild(btn);
        });

        englishWords.forEach(word => {
            const btn = document.createElement('button');
            btn.className = 'word-btn';
            btn.textContent = word;
            btn.onclick = () => selectWord(btn, 'en');
            colEn.appendChild(btn);
        });
    }

    function selectWord(btn, lang) {
        if (isChecking || btn.classList.contains('match-success')) return;

        if (lang === 'es') {
            if (selectedSpanish) selectedSpanish.classList.remove('selected');
            selectedSpanish = btn;
            btn.classList.add('selected');
        } else {
            if (selectedEnglish) selectedEnglish.classList.remove('selected');
            selectedEnglish = btn;
            btn.classList.add('selected');
        }

        if (selectedSpanish && selectedEnglish) {
            checkMatch();
        }
    }

    function checkMatch() {
        isChecking = true;
        const esVal = selectedSpanish.textContent;
        const enVal = selectedEnglish.textContent;

        const correctPair = levelsData[currentLevel].find(p => p.es === esVal && p.en === enVal);

        if (correctPair) {
            selectedSpanish.classList.remove('selected');
            selectedEnglish.classList.remove('selected');
            selectedSpanish.classList.add('match-success');
            selectedEnglish.classList.add('match-success');
            selectedSpanish = null;
            selectedEnglish = null;
            isChecking = false;
        } else {
            selectedSpanish.classList.add('match-error');
            selectedEnglish.classList.add('match-error');

            setTimeout(() => {
                if (selectedSpanish) selectedSpanish.classList.remove('match-error', 'selected');
                if (selectedEnglish) selectedEnglish.classList.remove('match-error', 'selected');
                selectedSpanish = null;
                selectedEnglish = null;
                isChecking = false;
            }, 1000);
        }
    }

    // Inicializar
    window.onload = renderLevel;
</script>

</body>
</html>
