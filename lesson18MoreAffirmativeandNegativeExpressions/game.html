<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matching Game - Affirmative and Negative Expressions</title>
    <style>
        :root {
            --primary-color: #FF79AC;
            --secondary-color: #FFEBF2;
            --btn-hover: #FFB3D1;
            --text-color: #121118;
            --bg-color: #FFFFFF;
            --success-bg: #D4EDDA;
            --error-bg: #F8D7DA;
            --gray-bg: #F9F9F9;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Platform Medium', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 850px;
            text-align: center;
        }

        h1 {
            font-size: clamp(2.2rem, 5vw, 2.5rem);
            font-weight: bold;
            color: var(--primary-color);
            margin: 0 0 5px 0;
        }

        h2 {
            font-size: clamp(1.4rem, 4vw, 1.8rem);
            color: var(--text-color);
            border-bottom: 2px solid var(--primary-color);
            display: inline-block;
            margin: 0 0 25px 0;
            padding-bottom: 5px;
            font-weight: normal;
            text-transform: lowercase;
        }

        .level-nav {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
        }

        .btn-level {
            background-color: var(--secondary-color);
            border: none;
            border-bottom: 3px solid var(--primary-color);
            border-radius: 5px;
            padding: 8px 15px;
            font-size: 0.9rem;
            color: var(--text-color);
            cursor: pointer;
            transition: transform 0.1s;
        }

        .btn-level.active {
            background-color: var(--primary-color);
            color: white;
            font-weight: bold;
        }

        .game-board {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            background-color: var(--gray-bg);
            padding: 20px;
            border-radius: 8px;
        }

        .column {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-word {
            background-color: var(--secondary-color);
            border: none;
            border-bottom: 3px solid var(--primary-color);
            border-radius: 4px;
            padding: 12px;
            font-size: 1rem;
            color: var(--text-color);
            cursor: pointer;
            text-align: center;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s, color 0.2s;
        }

        .btn-word.selected {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-word.correct {
            background-color: var(--success-bg) !important;
            border-bottom-color: #28a745 !important;
            cursor: default;
            pointer-events: none;
        }

        .btn-word.incorrect {
            background-color: var(--error-bg) !important;
            border-bottom-color: #dc3545 !important;
        }

        /* Mensaje de completado */
        .completion-msg {
            margin-top: 20px;
            padding: 12px;
            background-color: var(--success-bg);
            color: #155724;
            font-weight: bold;
            border-radius: 5px;
            display: none;
        }

        @media (max-width: 500px) {
            .game-board {
                gap: 10px;
                padding: 10px;
            }
            .btn-word {
                font-size: 0.9rem;
                padding: 8px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Matching game</h1>
    <h2>test your memory</h2>

    <div class="level-nav" id="levelNav">
        <!-- Botones de nivel generados por JS -->
    </div>

    <div class="game-board" id="gameBoard">
        <div class="column" id="leftCol"></div>
        <div class="column" id="rightCol"></div>
    </div>

    <div class="completion-msg" id="completionMsg">¡Nivel completado! Cargando siguiente nivel...</div>
</div>

<script>
    // Tus 7 niveles originales de vocabulario
    const levels = [
        // Nivel 1: 7 pares
        [
            { es: 'A trabajar', en: 'Let’s work' },
            { es: 'de nuevo', en: 'again' },
            { es: 'mejor', en: 'better' },
            { es: 'alguno', en: 'any, one' },
            { es: 'favorito', en: 'favorite' },
            { es: 'algunos', en: 'some' },
            { es: 'diferente', en: 'different' },
        ],
        // Nivel 2: 7 pares
        [
            { es: 'otra vez', en: 'again' },
            { es: 'ninguno', en: 'none, not any' },
            { es: 'el interés', en: 'interest' },
            { es: 'el elefante', en: 'elephant' },
            { es: 'el deseo', en: 'desire' },
            { es: 'el sol', en: 'sun' },
            { es: 'la bandera', en: 'flag' },
        ],
        // Nivel 3: 7 pares
        [
            { es: 'el cielo', en: 'sky' },
            { es: 'la región', en: 'region' },
            { es: 'el color', en: 'color' },
            { es: 'el perro', en: 'dog' },
            { es: 'rojo', en: 'red' },
            { es: 'rosa', en: 'pink' },
            { es: 'naranja', en: 'orange' },
        ],
        // Nivel 4: 7 pares
        [
            { es: 'negro', en: 'black' },
            { es: 'amarillo', en: 'yellow' },
            { es: 'marrón', en: 'brown' },
            { es: 'verde', en: 'green' },
            { es: 'blanco', en: 'white' },
            { es: 'azul', en: 'blue' },
            { es: 'gris', en: 'gray' },
        ],
        // Nivel 5: 8 pares
        [
            { es: 'morado', en: 'purple' },
            { es: 'la ropa', en: 'clothing' },
            { es: 'el suéter', en: 'sweater' },
            { es: 'la camisa', en: 'shirt' },
            { es: 'la chaqueta', en: 'jacket' },
            { es: 'el saco', en: 'suit jacket' },
            { es: 'el abrigo', en: 'coat' },
            { es: 'la camiseta', en: 'T-shirt' },
        ],
        // Nivel 6: 8 pares
        [
            { es: 'la corbata', en: 'tie' },
            { es: 'la blusa', en: 'blouse' },
            { es: 'el cinturón', en: 'belt' },
            { es: 'la falda', en: 'skirt' },
            { es: 'los pantalones', en: 'pants' },
            { es: 'el vestido', en: 'dress' },
            { es: 'el traje', en: 'suit' },
            { es: 'las sandalias', en: 'sandals' },
        ],
        // Nivel 7: 8 pares
        [
            { es: 'la ropa interior', en: 'underwear' },
            { es: 'los calcetines', en: 'socks' },
            { es: 'las medias', en: 'stockings' },
            { es: 'los zapatos', en: 'shoes' },
            { es: 'los zapatos deportivos', en: 'sneakers' },
            { es: 'el sombrero', en: 'hat' },
            { es: 'las botas', en: 'boots' },
            { es: 'la gorra', en: 'cap' },
        ]
    ];

    let currentLevel = 0;
    let selectedLeft = null;
    let selectedRight = null;
    let busy = false;
    let matchedPairs = 0;

    function init() {
        renderLevelNav();
        loadLevel(0);
    }

    function renderLevelNav() {
        const nav = document.getElementById('levelNav');
        nav.innerHTML = '';
        levels.forEach((_, index) => {
            const btn = document.createElement('button');
            btn.className = `btn-level ${index === currentLevel ? 'active' : ''}`;
            btn.innerText = `Nivel ${index + 1}`;
            btn.onclick = () => loadLevel(index);
            nav.appendChild(btn);
        });
    }

    function loadLevel(index) {
        if (busy) return;
        currentLevel = index;
        selectedLeft = null;
        selectedRight = null;
        matchedPairs = 0;
        
        document.getElementById('completionMsg').style.display = 'none';

        document.querySelectorAll('.btn-level').forEach((btn, i) => {
            btn.classList.toggle('active', i === index);
        });

        const data = levels[index];
        const leftCol = document.getElementById('leftCol');
        const rightCol = document.getElementById('rightCol');

        leftCol.innerHTML = '';
        rightCol.innerHTML = '';

        const shuffledLeft = [...data].sort(() => Math.random() - 0.5);
        const shuffledRight = [...data].sort(() => Math.random() - 0.5);

        shuffledLeft.forEach(item => {
            leftCol.appendChild(createWordButton(item.es, 'left', item.en));
        });

        shuffledRight.forEach(item => {
            rightCol.appendChild(createWordButton(item.en, 'right', item.en));
        });
    }

    function createWordButton(text, side, matchKey) {
        const btn = document.createElement('button');
        btn.className = 'btn-word';
        btn.innerText = text;
        btn.dataset.side = side;
        btn.dataset.match = matchKey;
        btn.onclick = () => handleSelection(btn);
        return btn;
    }

    function handleSelection(btn) {
        if (busy || btn.classList.contains('correct')) return;

        const side = btn.dataset.side;

        if (side === 'left') {
            if (selectedLeft) selectedLeft.classList.remove('selected');
            selectedLeft = btn;
            btn.classList.add('selected');
        } else {
            if (selectedRight) selectedRight.classList.remove('selected');
            selectedRight = btn;
            btn.classList.add('selected');
        }

        checkMatch();
    }

    function checkMatch() {
        if (selectedLeft && selectedRight) {
            const leftKey = selectedLeft.dataset.match;
            const rightKey = selectedRight.dataset.match;

            const tempLeft = selectedLeft;
            const tempRight = selectedRight;

            selectedLeft = null;
            selectedRight = null;

            if (leftKey === rightKey) {
                tempLeft.classList.add('correct');
                tempRight.classList.add('correct');
                tempLeft.classList.remove('selected');
                tempRight.classList.remove('selected');
                matchedPairs++;

                // Verificar si se completó el nivel
                if (matchedPairs === levels[currentLevel].length) {
                    const msg = document.getElementById('completionMsg');
                    if (currentLevel === levels.length - 1) {
                        msg.innerText = '¡Felicidades! Has completado todo el juego.';
                    } else {
                        msg.innerText = '¡Nivel completado! Cargando siguiente nivel...';
                    }
                    msg.style.display = 'block';

                    if (currentLevel < levels.length - 1) {
                        setTimeout(() => {
                            loadLevel(currentLevel + 1);
                        }, 1500);
                    }
                }
            } else {
                busy = true;
                tempLeft.classList.add('incorrect');
                tempRight.classList.add('incorrect');
                
                setTimeout(() => {
                    tempLeft.classList.remove('incorrect', 'selected');
                    tempRight.classList.remove('incorrect', 'selected');
                    busy = false;
                }, 1000);
            }
        }
    }

    window.onload = init;
</script>

</body>
</html>
