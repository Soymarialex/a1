<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matching Game - Vocabulario</title>
    <!-- Fuente Google Inter y Segoe UI fallback -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* Guía de Estilo Visual basada en la especificación elegida */
        :root {
            --primary-pink: #FF79AC;
            --secondary-pink: #FFEBF2;
            --text-main: #121118;
            --bg-page: #FFFFFF;
            --success-bg: #D4EDDA;
            --success-border: #28a745;
            --error-bg: #F8D7DA;
            --error-border: #dc3545;
            --btn-bg: #FFB3D1;
            --box-bg: #F9F9F9;
            --shadow-subtle: 0 4px 12px rgba(18, 17, 24, 0.05);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 15px;
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: 'Inter', 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 850px;
            text-align: center;
        }

        h1 {
            color: var(--primary-pink);
            font-size: 2.5rem;
            font-weight: 800;
            margin: 0 0 5px 0;
            letter-spacing: -0.5px;
        }

        h2 {
            color: var(--primary-pink);
            font-size: 1.4rem;
            font-weight: 600;
            border-bottom: 2px solid var(--primary-pink);
            display: inline-block;
            margin: 0 0 25px 0;
            padding-bottom: 5px;
            text-transform: lowercase;
        }

        /* Navegación de niveles */
        .level-selector {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .level-btn {
            background-color: var(--btn-bg);
            border: none;
            border-bottom: 3px solid var(--primary-pink);
            border-radius: 8px;
            padding: 10px 18px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-main);
            transition: all 0.2s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .level-btn:hover:not(.active) {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .level-btn.active {
            background-color: var(--primary-pink);
            color: white;
            box-shadow: 0 4px 10px rgba(255, 121, 172, 0.3);
        }

        /* Barra de Progreso del Nivel */
        .progress-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 750px;
            margin: 0 auto 15px auto;
            font-size: 0.9rem;
            font-weight: 600;
            color: #666;
        }

        .progress-bar-bg {
            flex-grow: 1;
            height: 8px;
            background-color: #eee;
            border-radius: 10px;
            margin: 0 12px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background-color: var(--primary-pink);
            transition: width 0.3s ease;
            border-radius: 10px;
        }

        /* Área de juego */
        .game-area {
            background-color: var(--box-bg);
            border-radius: 12px;
            padding: 25px 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            min-height: 280px;
            box-shadow: var(--shadow-subtle);
            border: 1px solid #f0f0f0;
        }

        .column-header {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
            color: #888;
            margin-bottom: 10px;
        }

        .column {
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
        }

        .word-btn {
            width: 100%;
            max-width: 280px;
            background-color: var(--btn-bg);
            border: none;
            border-bottom: 3px solid #808080; /* Gris según guía */
            border-radius: 8px;
            padding: 14px 16px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-main);
            text-align: center;
            transition: all 0.2s ease;
            position: relative;
            user-select: none;
            line-height: 1.3;
        }

        .word-btn:hover:not(.selected):not(.match-success):not(.match-error) {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.08);
        }

        /* Estados de los botones */
        .word-btn.selected {
            background-color: var(--secondary-pink);
            border-bottom-color: var(--primary-pink);
            box-shadow: 0 0 0 2px var(--primary-pink) inset;
            transform: scale(1.02);
        }

        .word-btn.match-success {
            background-color: var(--success-bg) !important;
            border-bottom-color: var(--success-border) !important;
            color: #155724 !important;
            pointer-events: none;
            opacity: 0.85;
        }

        .word-btn.match-error {
            background-color: var(--error-bg) !important;
            border-bottom-color: var(--error-border) !important;
            color: #721c24 !important;
            animation: shake 0.4s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        /* Modal de nivel completado / felicidades */
        .completion-modal {
            display: none;
            position: fixed;
            inset: 0;
            background-color: rgba(18, 17, 24, 0.4);
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 20px;
            animation: fadeIn 0.3s ease;
        }

        .completion-modal.show {
            display: flex;
        }

        .modal-card {
            background-color: var(--bg-page);
            border-radius: 16px;
            padding: 30px 25px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            border-top: 6px solid var(--primary-pink);
            animation: slideUp 0.3s ease;
        }

        .modal-card h3 {
            color: var(--primary-pink);
            font-size: 1.8rem;
            margin: 0 0 10px 0;
        }

        .modal-card p {
            font-size: 1.05rem;
            color: var(--text-main);
            margin-bottom: 25px;
        }

        .action-btn {
            background-color: var(--primary-pink);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(255, 121, 172, 0.3);
        }

        .action-btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* Responsividad básica */
        @media (max-width: 600px) {
            h1 { font-size: 2rem; }
            h2 { font-size: 1.2rem; }
            .game-area { grid-template-columns: 1fr; gap: 15px; }
            .word-btn { max-width: 100%; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Matching game</h1>
    <h2>test your memory</h2>

    <!-- Selector dinámico de niveles (6 niveles) -->
    <div class="level-selector" id="levelSelector"></div>

    <!-- Indicador de progreso del nivel actual -->
    <div class="progress-container">
        <span id="progressText">0 / 0</span>
        <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progressBar"></div>
        </div>
        <span id="levelName">Nivel 1</span>
    </div>

    <!-- Área interactiva de emparejamiento -->
    <div class="game-area">
        <div class="column">
            <div class="column-header">Español</div>
            <div class="column" id="colSpanish" style="width: 100%;"></div>
        </div>
        <div class="column">
            <div class="column-header">Inglés</div>
            <div class="column" id="colEnglish" style="width: 100%;"></div>
        </div>
    </div>
</div>

<!-- Modal de Felicitaciones -->
<div class="completion-modal" id="completionModal">
    <div class="modal-card">
        <h3>¡Felicidades! 🎉</h3>
        <p id="modalMessage">Has completado con éxito este nivel.</p>
        <button class="action-btn" id="nextLevelBtn" onclick="advanceOrReset()">Siguiente Nivel</button>
    </div>
</div>

<script>
    // Vocabulario original preservado exactamente en 6 niveles correspondientes
    const levelsData = [
        // Nivel 1: Verbos 1 (8 pares)
        [
            { es: 'hablar', en: 'to speak, to talk' },
            { es: 'bailar', en: 'to dance' },
            { es: 'tomar', en: 'to take, to drink' },
            { es: 'ayudar', en: 'to help' },
            { es: 'comprar', en: 'to buy' },
            { es: 'preparar', en: 'to prepare' },
            { es: 'escuchar', en: 'to hear' },
            { es: 'viajar', en: 'to travel' }
        ],
        // Nivel 2: Verbos 2 (8 pares)
        [
            { es: 'trabajar', en: 'to work' },
            { es: 'llegar', en: 'to arrive' },
            { es: 'estudiar', en: 'to study' },
            { es: 'cantar', en: 'to sing' },
            { es: 'cocinar', en: 'to cook' },
            { es: 'indicar', en: 'to indicate' },
            { es: 'ordenar', en: 'to order' },
            { es: 'dedicar', en: 'to dedicate' }
        ],
        // Nivel 3: Adjetivos 1 (5 pares)
        [
            { es: 'fuerte', en: 'strong' },
            { es: 'egoísta', en: 'selfish' },
            { es: 'trabajador', en: 'hard-working' },
            { es: 'hablador', en: 'talkative' },
            { es: 'ideal', en: 'ideal' }
        ],
        // Nivel 4: Adjetivos 2 (5 pares)
        [
            { es: 'tímido', en: 'timid' },
            { es: 'terrible', en: 'terrible' },
            { es: 'fenomenal', en: 'phenomenal' },
            { es: 'paciente', en: 'patient' },
            { es: 'impaciente', en: 'impatient' }
        ],
        // Nivel 5: Adjetivos 3 (5 pares)
        [
            { es: 'contento', en: 'happy' },
            { es: 'famoso', en: 'famous' },
            { es: 'formal', en: 'formal' },
            { es: 'informal', en: 'informal' },
            { es: 'bueno', en: 'good' }
        ],
        // Nivel 6: Adjetivos 4 (5 pares)
        [
            { es: 'malo', en: 'bad' },
            { es: 'mucho', en: 'a lot' },
            { es: 'muchos', en: 'many' },
            { es: 'poco', en: 'little' },
            { es: 'pocos', en: 'few' }
        ]
    ];

    let currentLevel = 0;
    let selectedSpanish = null;
    let selectedEnglish = null;
    let isChecking = false;
    let matchedPairsCount = 0;

    /**
     * Algoritmo de mezcla Fisher-Yates para asegurar aleatoriedad real
     */
    function shuffle(array) {
        const arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function renderLevelSelector() {
        const container = document.getElementById('levelSelector');
        container.innerHTML = '';

        levelsData.forEach((_, idx) => {
            const btn = document.createElement('button');
            btn.className = `level-btn ${idx === currentLevel ? 'active' : ''}`;
            btn.textContent = `Nivel ${idx + 1}`;
            btn.onclick = () => changeLevel(idx);
            container.appendChild(btn);
        });
    }

    function changeLevel(levelIdx) {
        if (isChecking) return;
        currentLevel = levelIdx;
        renderLevelSelector();
        resetGame();
        renderLevel();
    }

    function resetGame() {
        selectedSpanish = null;
        selectedEnglish = null;
        isChecking = false;
        matchedPairsCount = 0;
        document.getElementById('colSpanish').innerHTML = '';
        document.getElementById('colEnglish').innerHTML = '';
        document.getElementById('completionModal').classList.remove('show');
    }

    function renderLevel() {
        const data = levelsData[currentLevel];
        
        // Actualizar UI del indicador de nivel y progreso
        document.getElementById('levelName').textContent = `Nivel ${currentLevel + 1}`;
        updateProgressBar(0, data.length);

        // Mezclar las listas de palabras en español e inglés por separado
        const spanishItems = shuffle(data.map(item => ({ text: item.es, id: item.es })));
        const englishItems = shuffle(data.map(item => ({ text: item.en, id: item.es })));

        const colEs = document.getElementById('colSpanish');
        const colEn = document.getElementById('colEnglish');

        // Renderizar columna en español
        spanishItems.forEach(item => {
            const btn = document.createElement('button');
            btn.className = 'word-btn';
            btn.textContent = item.text;
            btn.dataset.matchId = item.id;
            btn.onclick = () => selectWord(btn, 'es');
            colEs.appendChild(btn);
        });

        // Renderizar columna en inglés
        englishItems.forEach(item => {
            const btn = document.createElement('button');
            btn.className = 'word-btn';
            btn.textContent = item.text;
            btn.dataset.matchId = item.id;
            btn.onclick = () => selectWord(btn, 'en');
            colEn.appendChild(btn);
        });
    }

    function selectWord(btn, lang) {
        if (isChecking || btn.classList.contains('match-success')) return;

        if (lang === 'es') {
            if (selectedSpanish) selectedSpanish.classList.remove('selected');
            if (selectedSpanish === btn) {
                selectedSpanish = null;
                return;
            }
            selectedSpanish = btn;
            btn.classList.add('selected');
        } else {
            if (selectedEnglish) selectedEnglish.classList.remove('selected');
            if (selectedEnglish === btn) {
                selectedEnglish = null;
                return;
            }
            selectedEnglish = btn;
            btn.classList.add('selected');
        }

        if (selectedSpanish && selectedEnglish) {
            checkMatch();
        }
    }

    function checkMatch() {
        isChecking = true;
        const esMatchId = selectedSpanish.dataset.matchId;
        const enMatchId = selectedEnglish.dataset.matchId;

        const totalInLevel = levelsData[currentLevel].length;

        if (esMatchId === enMatchId) {
            // ¡Acierto!
            selectedSpanish.classList.remove('selected');
            selectedEnglish.classList.remove('selected');
            
            selectedSpanish.classList.add('match-success');
            selectedEnglish.classList.add('match-success');

            selectedSpanish = null;
            selectedEnglish = null;
            isChecking = false;

            matchedPairsCount++;
            updateProgressBar(matchedPairsCount, totalInLevel);

            // Comprobar si el nivel se ha completado
            if (matchedPairsCount === totalInLevel) {
                setTimeout(showCompletionModal, 400);
            }
        } else {
            // ¡Error!
            selectedSpanish.classList.add('match-error');
            selectedEnglish.classList.add('match-error');

            setTimeout(() => {
                if (selectedSpanish) {
                    selectedSpanish.classList.remove('match-error', 'selected');
                }
                if (selectedEnglish) {
                    selectedEnglish.classList.remove('match-error', 'selected');
                }
                selectedSpanish = null;
                selectedEnglish = null;
                isChecking = false;
            }, 800);
        }
    }

    function updateProgressBar(current, total) {
        document.getElementById('progressText').textContent = `${current} / ${total}`;
        const percentage = (current / total) * 100;
        document.getElementById('progressBar').style.width = `${percentage}%`;
    }

    function showCompletionModal() {
        const modal = document.getElementById('completionModal');
        const modalMsg = document.getElementById('modalMessage');
        const nextBtn = document.getElementById('nextLevelBtn');

        if (currentLevel < levelsData.length - 1) {
            modalMsg.textContent = `Has completado exitosamente el Nivel ${currentLevel + 1}.`;
            nextBtn.textContent = 'Siguiente Nivel';
        } else {
            modalMsg.textContent = '¡Felicidades! Has completado todos los niveles de vocabulario.';
            nextBtn.textContent = 'Volver a Empezar';
        }

        modal.classList.add('show');
    }

    function advanceOrReset() {
        if (currentLevel < levelsData.length - 1) {
            changeLevel(currentLevel + 1);
        } else {
            changeLevel(0);
        }
    }

    // Inicializar la aplicación al cargar
    window.onload = () => {
        renderLevelSelector();
        renderLevel();
    };
</script>

</body>
</html>
